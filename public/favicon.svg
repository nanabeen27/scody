<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Scody">
  <!--
    Scody 마크. 청록 라운드 타일 + 워드마크와 같은 골격의 'S'.
    S 윤곽선은 Space Grotesk Bold(OFL, 레포 번들 폰트와 같은 서체)의 글리프에서 뽑았다.
    같은 기하를 앱 안에서는 src/components/Mark.tsx가 그린다. 둘을 함께 바꾼다.
    색은 src/theme/palette.ts의 accent/accentText 값이다(정적 파일이라 CSS 변수를 쓸 수 없다).
  -->
  <style>
    .tile { fill: #20808d }
    .mark { fill: #ffffff }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #3aa7b1 }
      .mark { fill: #04211f }
    }
  </style>
